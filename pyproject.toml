[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version", "readme", "dependencies"]
name = "gmod-spawnlist-generator"
requires-python = ">=3.13"
authors = [
    {name = "Willow Ciesialka", email = "wciesialka@gmail.com"}
]
description = "Create GMod Spawnlists for any mountable Source game."
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["gmod", "game", "steam", "valve", "source engine", "garrys mod"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment"
]

[project.scripts]
gmod-spawnlist-gen = "gmodspawnlistgen.__main__:main"

[project.urls]
Repository = "https://github.com/wciesialka/spawnlist-generator.git"
Issues = "https://github.com/wciesialka/spawnlist-generator/issues"

[tool.setuptools.dynamic]
version = {attr = "gmodspawnlistgen.__version__"}
readme = {file = ["README.md"], content-type = "text/markdown"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
include = ["gmodspawnlistgen*"]